# See docs at: https://mystmd.org/guide/frontmatter
version: 1
extends: toc.yml
project:
  id: executableengineer
  title: "Executable Engineering: Interactive Numerical Methods in Python"
  short_title: Executable Engineering
  description: Numerical methods textbook for undergraduate engineers.
  authors:
    - name: Michael J. Welland
      affiliations:
        - McMaster University
  copyright: "2026 Michael J. Welland"
  license:
    content:
      id: CC-BY-NC-4.0
    code:
      id: MIT

  edit_url: null
  github: themintlab/ExecutableEngineering
  jupyter:
    binder: true
  exports:
    - format: pdf
      template: plain_latex_book
      toc: toc.yml
      output: _build/exports/book.pdf
  exclude:
    - _build
    - .venv
    - .ipynb_checkpoints
  
  execute:
    execute_notebooks: off


site: 
  template: book-theme
  parts:
    primary_sidebar_footer: ""

  actions:
    - title: "Course AI"
      url: https://notebook.google.com/notebook/e1933866-a509-4c2a-b6f2-b627a9b76b05
  options:
    hide_authors: true
    logo: images/exe_logo.png
    logo_text: ""
    favicon: images/favicon.ico
    url: https://themintlab.github.io/ExecutableEngineering
    base_url: /ExecutableEngineering/

name: Build and Deploy Jupyter Book

on:
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["Build and Release PDF"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # This environment variable fixes the BASE_URL issue!
    env:
      BASE_URL: /${{ github.event.repository.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-book.txt

      - name: Build the book
        run: |
          jupyter-book build --html

      - name: Download latest released PDF
        if: github.event_name != 'pull_request'
        run: |
          curl -L https://github.com/${{ github.repository }}/releases/download/latest/book.pdf -o _build/html/book.pdf


      - name: Upload Pages artifact
        # This action automatically tars the folder and preps it specifically for GitHub Pages deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    # This job waits for the build job to finish
    needs: build
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

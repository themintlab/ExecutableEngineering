name: Build and Deploy Jupyter Book

on:
  push:
    branches: [main]
  # We still build on pull requests to ensure nothing is broken, but we only deploy on pushes to main.
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # This environment variable fixes the BASE_URL issue!
    env:
      BASE_URL: /${{ github.event.repository.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-book.txt
          pip install nbstripout

      - name: Strip notebook outputs
        run: |
          find . -name "*.ipynb" -not -path "*/\.venv/*" -exec nbstripout {} +

      - name: Build the book
        run: |
          jupyter-book build --html


      - name: Upload Pages artifact
        # This action automatically tars the folder and preps it specifically for GitHub Pages deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    # This job waits for the build job to finish
    needs: build
    # Only run the deployment if this was a push to the main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

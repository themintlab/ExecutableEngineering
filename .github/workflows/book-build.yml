name: Jupyter Book build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install book dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-check.txt
      - name: Build book
        run: jupyter-book build --site
      - name: Validate build output
        run: |
          [ -d "_build/site" ]

name: Mint_NM checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  package-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-check.txt
      - name: Build Mint_NM
        run: python -m build ./Mint_NM
      - name: Smoke test Mint_NM imports
        run: |
          ( cd /tmp && python -c "from Mint_NM import RootFinderOpen, RootFinderClosed, OptimizerOpen, OptimizerClosed, OptimizerGrad, init_model" )

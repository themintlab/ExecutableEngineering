name: executable_engineering checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-check.txt
      - name: Build executable_engineering
        run: python -m build ./executable_engineering
      - name: Smoke test executable_engineering imports
        run: |
          ( cd /tmp && python -c "from executable_engineering import RootFinderOpen, RootFinderClosed, OptimizerOpen, OptimizerClosed, OptimizerGrad, init_model" )

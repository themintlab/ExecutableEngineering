name: Build and Release PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # Needed to create and update releases

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-book.txt

      - name: Install PDF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick latexmk qpdf texlive-xetex texlive-latex-extra texlive-fonts-recommended

      - name: Build the PDF
        run: |
          jupyter-book build --pdf

      - name: Validate generated PDF
        run: |
          qpdf --check _build/exports/book.pdf

      - name: Upload PDF to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest PDF Build"
          body: "Automated build of the textbook PDF."
          files: _build/exports/book.pdf
